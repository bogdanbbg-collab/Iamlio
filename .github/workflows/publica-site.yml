name: Publică site-ul

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      versiune:
        description: "Revenire: republică o versiune anterioară (tag „publicat-…” sau commit de pe master). Gol = publicare normală."
        required: false
        default: ""

# Implicit doar citire; numai jobul de publicare (doar de pe master) primește drept de scriere.
permissions:
  contents: read

concurrency:
  group: publica-site-${{ github.ref }}
  cancel-in-progress: false

env:
  SITE_URL: https://iamlio.ro

jobs:
  # 1. Verificare rapidă (~2 min): teste unitare, sintaxă, poveștile. Spune și dacă s-a schimbat codul site-ului:
  #    când un commit aduce doar povești, testele din browser nu mai sunt necesare (site-ul final tot se testează
  #    în Chromium înainte de urcare, în jobul de publicare).
  verifica:
    if: ${{ !inputs.versiune }}
    runs-on: ubuntu-24.04
    # o rulare blocată (de ex. o instalare care nu se termină) se oprește singură, fără să țină publicările pe loc
    timeout-minutes: 20
    outputs:
      cod: ${{ steps.schimbari.outputs.cod }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      # pachetele ffmpeg păstrate între rulări (vezi scripts/instaleaza_ffmpeg.sh)
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/apt-ffmpeg
          key: apt-ffmpeg-ubuntu-24.04-v1

      - name: Instalează uneltele (versiuni exacte din fișierele .lock)
        timeout-minutes: 15
        run: |
          pip install -r requirements.lock
          scripts/instaleaza_ffmpeg.sh

      - name: Teste (Python, sintaxă JavaScript și PHP)
        run: |
          python -m unittest discover -s tests -v
          for f in public/assets/js/*.js; do node --check "$f"; done
          for f in public/api/*.php; do php -l "$f"; done

      - name: Pregătește și verifică poveștile
        run: python scripts/stories.py prepare

      - name: Ce s-a schimbat? (doar povești → fără testele din browser)
        id: schimbari
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          cod=true
          if [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git diff --name-only "$BEFORE" HEAD > schimbari.txt
            if ! grep -qvE '^(public/stories/|rapoarte/|[^/]+\.md$)' schimbari.txt; then cod=false; fi
          fi
          echo "cod=$cod" >> "$GITHUB_OUTPUT"
          echo "Codul site-ului s-a schimbat: $cod" >> "$GITHUB_STEP_SUMMARY"

      - name: La pull request, toate poveștile trebuie să treacă verificarea
        if: github.event_name == 'pull_request'
        run: python scripts/stories.py status

  # 1b. Testele din browser, câte un job pentru fiecare browser, în paralel (doar când s-a schimbat codul).
  #     Rulează în același timp cu pregătirea imaginilor și a vocilor din jobul de publicare.
  browser:
    needs: verifica
    if: needs.verifica.outputs.cod == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      # pachetele de sistem și browserul păstrate între rulări (vezi scripts/instaleaza_browser.sh)
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/apt-browser
            ~/.cache/ms-playwright
          key: browser-${{ matrix.browser }}-ubuntu-24.04-${{ hashFiles('package-lock.json') }}-v1

      - name: Instalează uneltele și browserul
        timeout-minutes: 15
        run: |
          pip install -r requirements.lock
          npm ci --no-audit --no-fund
          scripts/instaleaza_browser.sh ${{ matrix.browser }}

      - name: Teste în browser — ${{ matrix.browser }}
        run: |
          python scripts/stories.py prepare
          python scripts/stories.py index
          python scripts/stories.py stage
          BROWSER=${{ matrix.browser }} node --test tests/e2e/*.test.mjs

      # Capturile de ecran, pentru verificarea vizuală (Actions → rularea → Artifacts).
      - name: Salvează capturile de ecran
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capturi-ecran-${{ matrix.browser }}
          path: build/capturi/
          retention-days: 14
          if-no-files-found: ignore

  # 2. Publicare: doar de pe master (push sau pornire manuală pe master), după ce verificarea a trecut.
  #    Cu „versiune” completată, republică acea versiune (revenire), fără să modifice nimic în repository.
  publica:
    needs: verifica
    if: >-
      always() && github.ref == 'refs/heads/master' && github.event_name != 'pull_request' &&
      (needs.verifica.result == 'success' || (needs.verifica.result == 'skipped' && inputs.versiune != ''))
    runs-on: ubuntu-24.04
    # o rulare blocată (de ex. o instalare care nu se termină) se oprește singură, fără să țină publicările pe loc
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read # ca să aștepte rezultatul testelor din browser (jobul „browser”)
    env:
      NORMAL: ${{ !inputs.versiune }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Revenire — verifică versiunea cerută și trece pe ea
        if: env.NORMAL != 'true'
        env:
          VERSIUNE: ${{ inputs.versiune }}
        run: |
          set -e
          sha=$(git rev-parse --verify "${VERSIUNE}^{commit}")
          git merge-base --is-ancestor "$sha" origin/master || { echo "::error::$VERSIUNE nu este o versiune de pe master."; exit 1; }
          git checkout -q "$sha"
          echo "Se republică versiunea $VERSIUNE ($sha)."

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # pachetele ffmpeg păstrate între rulări (vezi scripts/instaleaza_ffmpeg.sh)
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/apt-ffmpeg
          key: apt-ffmpeg-ubuntu-24.04-v1

      - name: Instalează uneltele
        timeout-minutes: 15
        run: |
          if [ -f requirements.lock ]; then pip install -r requirements.lock; else pip install -r requirements.txt; fi
          if [ -x scripts/instaleaza_ffmpeg.sh ]; then scripts/instaleaza_ffmpeg.sh; else
            # o versiune veche (la revenire) nu are scriptul
            command -v ffmpeg >/dev/null || (sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg)
          fi

      # Repară automat ce e mecanic, generează imaginile lipsă (dacă există OPENAI_API_KEY), optimizează,
      # verifică și scrie rapoartele din rapoarte/. O poveste greșită nu ajunge pe site, dar nu le oprește pe celelalte.
      - name: Pregătește poveștile (reparare automată, imagini, verificare, rapoarte)
        if: env.NORMAL == 'true'
        env:
          # imaginile lipsă, în ordine: Gemini, Pollinations, Cloudflare (gratuite), OpenAI (cu plată) — vezi scripts/imagini.py
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_IMAGE_MODEL: ${{ vars.CLOUDFLARE_IMAGE_MODEL }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          POLLINATIONS_IMAGE_MODEL: ${{ vars.POLLINATIONS_IMAGE_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IMAGE_MODEL: ${{ vars.IMAGE_MODEL }}
          IMAGE_QUALITY: ${{ vars.IMAGE_QUALITY }}
          MAX_IMAGES: ${{ vars.MAX_IMAGES }}
          MAX_IMAGES_MONTH: ${{ vars.MAX_IMAGES_MONTH }}
          MAX_LEI_MONTH: ${{ vars.MAX_LEI_MONTH }}
          IMAGE_COST_LEI: ${{ vars.IMAGE_COST_LEI }}
          IMAGE_PRICE_TEXT_IN: ${{ vars.IMAGE_PRICE_TEXT_IN }}
          IMAGE_PRICE_IMAGE_IN: ${{ vars.IMAGE_PRICE_IMAGE_IN }}
          IMAGE_PRICE_OUT: ${{ vars.IMAGE_PRICE_OUT }}
          USD_LEI: ${{ vars.USD_LEI }}
        run: python scripts/stories.py prepare

      - name: Generează vocea feminină și masculină (Gemini povestitor, Chirp 3 HD, rezervă edge-tts)
        if: env.NORMAL == 'true'
        env:
          # Google Cloud Text-to-Speech (Chirp 3 HD): 1.000.000 de caractere gratuite pe lună; limita de aici e mai mică
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          MAX_TTS_CHARS_MONTH: ${{ vars.MAX_TTS_CHARS_MONTH }}
          # Gemini TTS („povestitorul”, cu emoție): cota gratuită are câteva cereri pe zi; fișierele trec treptat pe el
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_DAILY: ${{ vars.GEMINI_TTS_DAILY }}
          GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL }}
        run: python scripts/stories.py audio

      - name: Verifică fișierele audio (decodare completă, ambele voci, toate paginile)
        if: env.NORMAL == 'true'
        run: python scripts/stories.py verify-audio

      - name: Actualizează biblioteca și pregătește site-ul (poveștile valide sau ultima lor versiune bună)
        env:
          # parola administratorului (panoul de administrare și previzualizarea poveștilor personalizate)
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          # codurile de verificare din Google Search Console și Bing Webmaster Tools (variabile de repository)
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
          PREVIEW_PASSWORD: ${{ secrets.PREVIEW_PASSWORD }}
          # „Consum și cote” din panoul de administrare (scripts/consum.py): ce servicii sunt configurate,
          # soldul Pollinations, minutele GitHub Actions din luna aceasta și limitele
          GH_TOKEN: ${{ github.token }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MAX_TTS_CHARS_MONTH: ${{ vars.MAX_TTS_CHARS_MONTH }}
          GEMINI_TTS_DAILY: ${{ vars.GEMINI_TTS_DAILY }}
          MAX_IMAGES_MONTH: ${{ vars.MAX_IMAGES_MONTH }}
          MAX_LEI_MONTH: ${{ vars.MAX_LEI_MONTH }}
          CLOUDFLARE_IMAGES_DAY: ${{ vars.CLOUDFLARE_IMAGES_DAY }}
          ACTIONS_MINUTES_MONTH: ${{ vars.ACTIONS_MINUTES_MONTH }}
          HOSTING_QUOTA_MB: ${{ vars.HOSTING_QUOTA_MB }}
          # la o publicare reală se notează data la care apare fiecare poveste nouă (pentru „Nou”)
          PUBLICARE: ${{ env.NORMAL == 'true' && '1' || '' }}
        run: |
          python scripts/stories.py index
          python scripts/stories.py stage

      # Site-ul exact așa cum se urcă (cu vocile și imaginile generate mai sus) trece încă o dată prin testele
      # din browser, înainte de publicare; dacă pică, nu se urcă nimic și nu se salvează nimic în repository.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: env.NORMAL == 'true'
        with:
          node-version: "22"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: env.NORMAL == 'true'
        with:
          path: |
            ~/.cache/apt-browser
            ~/.cache/ms-playwright
          key: browser-chromium-ubuntu-24.04-${{ hashFiles('package-lock.json') }}-v1

      - name: Testează site-ul final înainte de publicare (Chromium)
        if: env.NORMAL == 'true'
        timeout-minutes: 15
        run: |
          npm ci --no-audit --no-fund
          scripts/instaleaza_browser.sh chromium
          BROWSER=chromium node --test $(ls tests/e2e/*.test.mjs | grep -v capturi)

      # Imaginile și vocile s-au pregătit în același timp cu testele din browser; nimic nu se urcă și nimic nu se
      # salvează în repository până nu trec toate trei (Chromium, Firefox, WebKit).
      - name: Așteaptă testele din Chromium, Firefox și WebKit
        if: env.NORMAL == 'true' && needs.verifica.outputs.cod == 'true'
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=50"
          while true; do
            # o linie pe browser: „browser (webkit) completed success”
            gh api "$url" --jq '.jobs[] | select(.name | startswith("browser")) | "\(.name) \(.status) \(.conclusion)"' > browsere.txt || true
            if grep -Eq 'completed (failure|cancelled|timed_out)$' browsere.txt; then
              cat browsere.txt
              echo "::error::Testele din browser nu au trecut; nu se publică nimic."
              exit 1
            fi
            if [ "$(grep -c 'completed success$' browsere.txt)" -ge 3 ]; then
              cat browsere.txt
              echo "Toate testele din browser au trecut."
              break
            fi
            sleep 15
          done

      - name: Salvează reparațiile, imaginile, vocea, biblioteca și rapoartele în repository
        if: env.NORMAL == 'true'
        run: |
          git config user.name "iamlio-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/stories public/assets/audio rapoarte
          if ! git diff --cached --quiet; then
            git commit -m "Povești pregătite automat: reparații, imagini, voce, bibliotecă, rapoarte"
          fi
          # versiunea care se urcă acum (pentru tag): fără commit-urile altcuiva aduse mai jos de „pull”
          echo "PUBLICAT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/master)" ]; then
            # un commit nou între timp pe master (de ex. altă publicare): la o ciocnire în fișierele generate
            # (rapoarte, voci) rămâne varianta acestei publicări, ca imaginile generate acum să nu se piardă;
            # dacă tot nu merge, site-ul se urcă oricum, iar reparațiile se refac la publicarea următoare
            if git pull --rebase -X theirs origin master; then
              git push origin HEAD:master || echo "::warning::reparațiile automate nu s-au putut salva; se refac la publicarea următoare"
            else
              git rebase --abort || true
              echo "::warning::reparațiile automate se ciocnesc cu un commit nou; se refac la publicarea următoare"
            fi
          fi

      - name: Verifică datele FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=""
          [ -n "$FTP_SERVER" ] || missing="$missing FTP_SERVER"
          [ -n "$FTP_USERNAME" ] || missing="$missing FTP_USERNAME"
          [ -n "$FTP_PASSWORD" ] || missing="$missing FTP_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Lipsesc secretele:$missing (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Urcă site-ul pe host (FTPS)
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ftps
          local-dir: ./build/site/
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
          exclude: |
            **/.git*
            **/.git*/**
            api/data/citiri.json
            api/data/cheie.txt
            api/data/*.lock
            api/data/previzualizare-incercari.json
            api/data/autentificare-incercari.json
            api/data/vizite.json
            api/data/erori.json
            api/data/erori-vizitatori.json
            api/data/pareri.json
            api/data/*.tmp
            api/data/copii/**

      - name: Verifică site-ul live
        run: |
          set -e
          fetch() { curl -fsS --retry 4 --retry-delay 5 --retry-all-errors -H "Cache-Control: no-cache" "$SITE_URL/$1"; }
          fetch "" | grep -q "Lio îți citește o poveste"
          fetch "confidentialitate.html" | grep -q "Confidențialitate"
          fetch "stories/index.json" | diff -q - build/site/stories/index.json
          fetch "sitemap.xml" | diff -q - build/site/sitemap.xml
          fetch "llms.txt" | diff -q - build/site/llms.txt
          fetch "robots.txt" | diff -q - build/site/robots.txt
          fetch "api/citiri.php" | python -c "import json,sys; assert isinstance(json.load(sys.stdin)['citiri'], dict)"
          first=$(python -c "import json; s=json.load(open('build/site/stories/index.json'))['stories']; print(s[0]['id'] if s else '')")
          if [ -n "$first" ]; then
            fetch "p/$first.html" | diff -q - "build/site/p/$first.html"
            fetch "stories/$first/audio/manifest.json" | diff -q - "build/site/stories/$first/audio/manifest.json"
          fi
          for private in citiri.json cheie.txt parola.json admin-info.json vizite.json erori.json pareri.json; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL/api/data/$private")
            [ "$code" = "403" ] || [ "$code" = "404" ] || { echo "::error::api/data/$private este accesibil public (HTTP $code)"; exit 1; }
          done
          # .htaccess: fișierele ascunse blocate, antetele de securitate prezente, http:// trimis pe https://
          code=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL/.htaccess")
          [ "$code" = "403" ] || [ "$code" = "404" ] || { echo "::error::.htaccess este accesibil public (HTTP $code)"; exit 1; }
          curl -sI "$SITE_URL/" | grep -qi "^x-content-type-options: nosniff" \
            || echo "::warning::antetele de securitate din .htaccess nu apar (modulul mod_headers lipsește pe server?)"
          redirect=$(curl -s -o /dev/null -w "%{http_code} %{redirect_url}" "http://${SITE_URL#https://}/")
          case "$redirect" in 301\ https://*|302\ https://*) ;; *) echo "::warning::http:// nu trimite pe https:// ($redirect)" ;; esac
          code=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL/api/admin.php")
          [ "$code" = "401" ] || { echo "::error::api/admin.php răspunde fără autentificare (HTTP $code)"; exit 1; }
          # poveștile personalizate neaprobate: niciun fișier fără parola de previzualizare
          for preview in build/site/api/data/previzualizare/*/; do
            [ -d "$preview" ] || continue
            id=$(basename "$preview")
            for url in "stories/$id/story.json" "api/data/previzualizare/$id/story.json" "api/previzualizare.php?id=$id&f=story.json"; do
              code=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL/$url")
              case "$code" in 401|403|404) ;; *) echo "::error::$url este accesibil fără parolă (HTTP $code)"; exit 1 ;; esac
            done
          done
          echo "Site-ul live răspunde corect: $SITE_URL"

      # Bing (și prin el ChatGPT/Copilot) află imediat de paginile noi sau schimbate (vezi scripts/indexnow.py).
      - name: Anunță motoarele de căutare (IndexNow)
        if: env.NORMAL == 'true'
        continue-on-error: true
        run: python scripts/indexnow.py build/site

      # Fiecare publicare reușită primește un tag, ca să se poată reveni oricând la ea.
      - name: Marchează versiunea publicată
        if: env.NORMAL == 'true'
        run: |
          tag="publicat-$(date -u +%Y%m%d-%H%M%S)"
          git tag "$tag" "${PUBLICAT_SHA:-HEAD}"
          # GitHub refuză tag-ul robotului dacă în versiunea publicată s-a schimbat chiar un workflow (rar): site-ul
          # e oricum urcat, iar tag-ul următoarei publicări îl înlocuiește
          git push origin "$tag" || { echo "::warning::tag-ul $tag nu s-a putut salva (workflow schimbat în această versiune)"; exit 0; }
          echo "Versiune publicată: $tag" >> "$GITHUB_STEP_SUMMARY"

      # Site-ul e publicat cu poveștile bune; dacă una nu trece verificarea, rularea apare cu roșu
      # ca să se vadă, iar rapoarte/<poveste>.md spune exact ce trebuie corectat.
      - name: Toate poveștile sunt publicate?
        if: env.NORMAL == 'true'
        run: python scripts/stories.py status
