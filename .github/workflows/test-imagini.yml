name: Test generare imagini

# Pornit de mână (Actions → Test generare imagini → Run workflow): generează câte o imagine de probă cu fiecare
# variantă configurată (Gemini, Cloudflare, OpenAI) și arată în rezumat care merge. Imaginile apar la Artifacts.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.lock
      - name: Generează câte o imagine de probă cu fiecare variantă
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_IMAGE_MODEL: ${{ vars.CLOUDFLARE_IMAGE_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IMAGE_MODEL: ${{ vars.IMAGE_MODEL }}
        run: python scripts/imagini.py test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: imagini-de-proba
          path: build/test-imagini/
          if-no-files-found: ignore
