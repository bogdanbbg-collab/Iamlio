name: Imagini rămase (zilnic)

# Varianta gratuită de imagini (Cloudflare) are o cotă pe zi, reînnoită la 00:00 UTC. Dacă o poveste a rămas
# nepublicată pentru că s-a terminat cota, a doua zi dimineață pornește singură publicarea, care generează
# imaginile rămase. Dacă nu lipsește nicio imagine, nu face nimic.
on:
  schedule:
    - cron: "23 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  reia:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Lipsesc imagini?
        id: lipsa
        env:
          # doar ca să se știe dacă e configurat vreun generator (fără el, publicarea n-ar avea ce face)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import sys
          sys.path.insert(0, "scripts")
          import imagini, stories
          lipsa = []
          if imagini.enabled():
              for folder, data in stories.load_stories():
                  # o poveste cu structura stricată nu poate fi completată automat: o arată raportul ei
                  if isinstance(data, dict) and not data.get("_error") and not stories.structure_errors(data):
                      if imagini.missing(folder, data):
                          lipsa.append(folder.name)
          print("povesti=" + " ".join(lipsa))
          PY
      - name: Pornește publicarea
        if: steps.lipsa.outputs.povesti != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Lipsesc imagini la: ${{ steps.lipsa.outputs.povesti }}" >> "$GITHUB_STEP_SUMMARY"
          gh workflow run publica-site.yml --ref master
