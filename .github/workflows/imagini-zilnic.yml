name: Imagini și voci rămase (zilnic)

# Varianta gratuită de imagini (Cloudflare) are o cotă pe zi; în practică se reînnoiește pe la 04:00 UTC (la 03:55 încă
# refuză, la 04:05 merge), deci rularea de dimineață e după 04:00 UTC. Dacă o poveste a rămas
# nepublicată pentru că s-a terminat cota, a doua zi dimineață pornește singură publicarea, care generează
# imaginile rămase. Dacă nu lipsește nicio imagine, nu face nimic.
# La fel pentru voci: Gemini („povestitorul”) are câteva cereri gratuite pe zi, reînnoite la miezul nopții în
# California (~08:00 UTC); după aceea, cât timp mai sunt fișiere audio fără vocea Gemini, pornește publicarea.
on:
  schedule:
    - cron: "17 4 * * *"
    - cron: "41 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  reia:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Lipsesc imagini?
        id: lipsa
        env:
          # doar ca să se știe dacă e configurat vreun generator (fără el, publicarea n-ar avea ce face)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import sys
          sys.path.insert(0, "scripts")
          import imagini, stories
          lipsa = []
          if imagini.enabled():
              for folder, data in stories.load_stories():
                  # o poveste cu structura stricată nu poate fi completată automat: o arată raportul ei
                  if isinstance(data, dict) and not data.get("_error") and not stories.structure_errors(data):
                      if imagini.missing(folder, data):
                          lipsa.append(folder.name)
          print("povesti=" + " ".join(lipsa))
          print(f"voci={stories.voices_pending() if os.environ.get('GEMINI_API_KEY') else 0}")
          PY
      - name: Pornește publicarea
        # vocile doar la rularea de după reînnoirea cotei Gemini (sau pornită de mână)
        if: steps.lipsa.outputs.povesti != '' || (steps.lipsa.outputs.voci != '0' && github.event.schedule != '17 4 * * *')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Lipsesc imagini la: ${{ steps.lipsa.outputs.povesti }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Fișiere audio fără vocea Gemini: ${{ steps.lipsa.outputs.voci }}" >> "$GITHUB_STEP_SUMMARY"
          gh workflow run publica-site.yml --ref master
