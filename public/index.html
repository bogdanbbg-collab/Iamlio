<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Politica de securitate: pagina încarcă doar fișiere de pe iamlio.ro (fără scripturi străine sau din pagină) -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Iamlio — Lio îți citește o poveste</title>
  <meta name="description" content="Povești ilustrate pentru copii, citite cu voce de Lio, puiul de leu.">
  <meta name="theme-color" content="#FFF4E0">
  <link rel="canonical" href="https://iamlio.ro/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ro_RO">
  <meta property="og:site_name" content="Iamlio">
  <meta property="og:title" content="Iamlio — Lio îți citește o poveste">
  <meta property="og:description" content="Povești ilustrate pentru copii, citite cu voce de Lio, puiul de leu.">
  <meta property="og:url" content="https://iamlio.ro/">
  <meta property="og:image" content="https://iamlio.ro/assets/img/og-image.png?v=2">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Lio, puiul de leu cu eșarfă turcoaz, îți face cu mâna">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/img/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Iamlio">
  <link rel="preload" href="assets/fonts/baloo2-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="home">
  <header class="site-header">
    <a class="brand" href="./">
      <img src="favicon.svg" alt="" width="44" height="44">
      <span>I am <strong>Lio</strong></span>
    </a>
  </header>

  <main>
    <section class="hero">
      <button id="hero-lio" class="hero-lio" type="button" aria-label="Atinge-l pe Lio ca să-ți vorbească">
        <img src="assets/img/lio.svg" alt="" width="270" height="300">
      </button>
      <div class="bubble">
        <h1>Bună! Eu sunt Lio.</h1>
        <p id="lio-says">Alege o poveste și ți-o citesc eu.</p>
        <button id="lio-picks" class="lio-picks" type="button" hidden>
          <img src="assets/img/lio-cap.svg" alt="" width="36" height="36">
          <span>Lio, alege tu!</span>
        </button>
      </div>
    </section>

    <section class="library" aria-labelledby="library-title">
      <div class="library-head">
        <h2 id="library-title">Poveștile lui Lio</h2>
        <button id="filters-toggle" class="filters-toggle" type="button" aria-expanded="false" aria-controls="filters" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
          <span>Filtre</span>
          <span id="filters-badge" class="filters-badge" hidden></span>
        </button>
      </div>
      <div class="filters" id="filters" hidden>
        <div class="chips" id="category-chips" role="group" aria-label="Categorii"></div>
        <div class="filter-row">
          <div class="segmented" role="group" aria-label="Durata" data-filter="durata">
            <button type="button" data-value="">Orice durată</button>
            <button type="button" data-value="scurte" title="până la 4 minute">Scurte</button>
            <button type="button" data-value="medii" title="5–7 minute">Medii</button>
            <button type="button" data-value="lungi" title="8–10 minute">Lungi</button>
          </div>
          <button type="button" class="chip chip-fav" id="favorites-filter" aria-pressed="false">♥ Favorite</button>
        </div>
      </div>
      <p id="results-count" class="results-count" aria-live="polite"></p>
      <div id="stories" class="story-grid" aria-live="polite">
        <p class="muted">Se încarcă poveștile…</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Iamlio · povești pentru copii · <a href="confidentialitate.html">Confidențialitate</a> · <a href="mailto:contact@iamlio.ro">contact@iamlio.ro</a></p>
  </footer>

  <script src="assets/js/iamlio.js" defer></script>
  <script src="assets/js/library.js" defer></script>
</body>
</html>
