<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Iamlio — Lio îți citește o poveste</title>
  <meta name="description" content="Povești ilustrate pentru copii de 3–7 ani, citite cu voce de Lio, puiul de leu.">
  <meta name="theme-color" content="#FFF4E0">
  <link rel="canonical" href="https://iamlio.ro/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ro_RO">
  <meta property="og:site_name" content="Iamlio">
  <meta property="og:title" content="Iamlio — Lio îți citește o poveste">
  <meta property="og:description" content="Povești ilustrate pentru copii de 3–7 ani, citite cu voce de Lio, puiul de leu.">
  <meta property="og:url" content="https://iamlio.ro/">
  <meta property="og:image" content="https://iamlio.ro/assets/img/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Lio, puiul de leu cu eșarfă turcoaz, îți face cu mâna">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/img/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Iamlio">
  <link rel="preload" href="assets/fonts/baloo2-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="home">
  <header class="site-header">
    <a class="brand" href="./">
      <img src="favicon.svg" alt="" width="44" height="44">
      <span>I am <strong>Lio</strong></span>
    </a>
  </header>

  <main>
    <section class="hero">
      <button id="hero-lio" class="hero-lio" type="button" aria-label="Atinge-l pe Lio ca să-ți vorbească">
        <img src="assets/img/lio.svg" alt="" width="270" height="300">
      </button>
      <div class="bubble">
        <h1>Bună! Eu sunt Lio.</h1>
        <p id="lio-says">Alege o poveste și ți-o citesc eu. Dă paginile cu degetul, ca într-o carte adevărată!</p>
        <div class="voice-picker">
          <span>Cine citește?</span>
          <div class="voice-switch" role="group" aria-label="Vocea care citește">
            <button type="button" data-voice="feminin" title="Voce feminină"><span aria-hidden="true">👩</span> Feminină</button>
            <button type="button" data-voice="masculin" title="Voce masculină"><span aria-hidden="true">👨</span> Masculină</button>
          </div>
        </div>
      </div>
    </section>

    <section class="library" aria-labelledby="library-title">
      <h2 id="library-title">Poveștile lui Lio</h2>
      <div class="filters" id="filters" hidden>
        <div class="chips" id="category-chips" role="group" aria-label="Categorii"></div>
        <div class="filter-row">
          <div class="segmented" role="group" aria-label="Vârsta" data-filter="varsta">
            <button type="button" data-value="">Orice vârstă</button>
            <button type="button" data-value="3-5">3–5 ani</button>
            <button type="button" data-value="5-7">5–7 ani</button>
          </div>
          <div class="segmented" role="group" aria-label="Durata" data-filter="durata">
            <button type="button" data-value="">Orice durată</button>
            <button type="button" data-value="scurte" title="până la 4 minute">Scurte</button>
            <button type="button" data-value="medii" title="5–7 minute">Medii</button>
            <button type="button" data-value="lungi" title="8–10 minute">Lungi</button>
          </div>
          <button type="button" class="chip chip-fav" id="favorites-filter" aria-pressed="false">♥ Favorite</button>
        </div>
        <p id="results-count" class="results-count" aria-live="polite"></p>
      </div>
      <div id="stories" class="story-grid" aria-live="polite">
        <p class="muted">Se încarcă poveștile…</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Iamlio · povești pentru copii de 3–7 ani · <a href="confidentialitate.html">Confidențialitate</a> · <a href="mailto:contact@iamlio.ro">contact@iamlio.ro</a></p>
  </footer>

  <script src="assets/js/iamlio.js" defer></script>
  <script src="assets/js/library.js" defer></script>
</body>
</html>
