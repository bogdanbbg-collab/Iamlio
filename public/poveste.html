<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Poveste — Iamlio</title>
  <meta name="description" content="O poveste ilustrată pentru copii de 3–7 ani, citită cu voce de Lio, puiul de leu.">
  <meta name="theme-color" content="#2B3A73">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ro_RO">
  <meta property="og:site_name" content="Iamlio">
  <meta property="og:title" content="O poveste citită de Lio — Iamlio">
  <meta property="og:description" content="Povești ilustrate pentru copii de 3–7 ani, citite cu voce de Lio, puiul de leu.">
  <meta property="og:url" content="https://iamlio.ro/poveste.html">
  <meta property="og:image" content="https://iamlio.ro/assets/img/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Lio, puiul de leu cu eșarfă turcoaz, îți face cu mâna">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/baloo2-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="reader">
  <header class="reader-bar">
    <a class="icon-btn" href="./" aria-label="Înapoi la povești">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div class="reader-heading">
      <h1 id="story-title" class="reader-title">Poveste</h1>
      <p id="story-reads" class="reader-reads" hidden></p>
    </div>
    <div class="voice-switch voice-switch-compact" role="group" aria-label="Vocea care citește">
      <button type="button" data-voice="feminin" title="Voce feminină"><span aria-hidden="true">👩</span><span class="voice-label">Ea</span></button>
      <button type="button" data-voice="masculin" title="Voce masculină"><span aria-hidden="true">👨</span><span class="voice-label">El</span></button>
    </div>
    <button id="auto-btn" class="icon-btn" type="button" aria-pressed="true" title="Întoarce singur paginile când citește Lio">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 0 1 13.7-5.6M20 12a8 8 0 0 1-13.7 5.6"/><path d="M18 3v4h-4M6 21v-4h4"/></svg>
    </button>
  </header>

  <main class="stage">
    <div id="book" class="book" tabindex="0" aria-roledescription="carte" aria-live="polite"></div>
  </main>

  <nav class="reader-controls" aria-label="Controale poveste">
    <button id="prev-btn" class="nav-btn nav-prev" type="button" aria-label="Pagina anterioară">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button id="play-btn" class="play-btn" type="button" aria-label="Lio citește povestea">
      <span id="play-lio" class="play-lio"><img src="assets/img/lio-cap.svg" alt=""></span>
      <span class="play-badge" aria-hidden="true"></span>
    </button>
    <button id="next-btn" class="nav-btn nav-next" type="button" aria-label="Pagina următoare">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </nav>
  <div id="dots" class="dots" aria-hidden="true"></div>

  <script src="assets/js/iamlio.js" defer></script>
  <script src="assets/js/reader.js" defer></script>
</body>
</html>
