<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Poveste — Iamlio</title>
  <meta name="description" content="O poveste ilustrată pentru copii de 3–7 ani, citită cu voce de Lio, puiul de leu.">
  <meta name="theme-color" content="#2B3A73">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ro_RO">
  <meta property="og:site_name" content="Iamlio">
  <meta property="og:title" content="O poveste citită de Lio — Iamlio">
  <meta property="og:description" content="Povești ilustrate pentru copii de 3–7 ani, citite cu voce de Lio, puiul de leu.">
  <meta property="og:url" content="https://iamlio.ro/poveste.html">
  <meta property="og:image" content="https://iamlio.ro/assets/img/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Lio, puiul de leu cu eșarfă turcoaz, îți face cu mâna">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/img/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Iamlio">
  <link rel="preload" href="assets/fonts/baloo2-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="reader">
  <header class="reader-bar">
    <a class="icon-btn" href="./" aria-label="Înapoi la povești">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div class="reader-heading">
      <h1 id="story-title" class="reader-title">Poveste</h1>
      <p id="story-reads" class="reader-reads" hidden></p>
    </div>
    <button id="settings-btn" class="icon-btn" type="button" aria-haspopup="dialog" aria-controls="settings" aria-label="Setări de citire">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
    </button>
  </header>

  <main class="stage">
    <div id="book" class="book" tabindex="0" aria-roledescription="carte" aria-live="polite"></div>
  </main>

  <nav class="reader-controls" aria-label="Controale poveste">
    <button id="prev-btn" class="nav-btn nav-prev" type="button" aria-label="Pagina anterioară">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button id="play-btn" class="play-btn" type="button" aria-label="Lio citește povestea">
      <span id="play-lio" class="play-lio"><img src="assets/img/lio-cap.svg" alt=""></span>
      <span class="play-badge" aria-hidden="true"></span>
    </button>
    <button id="next-btn" class="nav-btn nav-next" type="button" aria-label="Pagina următoare">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </nav>
  <div id="dots" class="dots" aria-hidden="true"></div>

  <div id="settings" class="settings" hidden>
    <div class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="settings-head">
        <h2 id="settings-title">Setări de citire</h2>
        <button id="settings-close" class="icon-btn" type="button" aria-label="Închide setările">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <div class="setting">
        <span class="setting-label">Cine citește</span>
        <div class="voice-switch" role="group" aria-label="Vocea care citește">
          <button type="button" data-voice="feminin"><span aria-hidden="true">👩</span> Feminină</button>
          <button type="button" data-voice="masculin"><span aria-hidden="true">👨</span> Masculină</button>
        </div>
      </div>

      <div class="setting">
        <span class="setting-label">Viteza vocii</span>
        <div class="speed-switch" role="group" aria-label="Viteza vocii">
          <button type="button" data-speed="0.8">0,8×</button>
          <button type="button" data-speed="0.9">0,9×</button>
          <button type="button" data-speed="1">1×</button>
          <button type="button" data-speed="1.1">1,1×</button>
        </div>
      </div>

      <label class="setting setting-toggle">
        <span><span class="setting-label">Lio dă singur paginile</span><small>după ce termină de citit o pagină</small></span>
        <input id="auto-turn" type="checkbox" role="switch">
      </label>

      <label class="setting setting-toggle">
        <span><span class="setting-label">🌙 Mod de culcare</span><small>culori calme, lumină mai slabă, voce mai încetă</small></span>
        <input id="bedtime" type="checkbox" role="switch">
      </label>

      <div class="setting">
        <button id="fullscreen-btn" class="pill" type="button" hidden>Ecran complet</button>
        <p id="fullscreen-hint" class="setting-hint" hidden>Pe iPhone și iPad: apasă <strong>Partajează</strong>, apoi
          <strong>„Adaugă pe ecranul principal”</strong>. Poveștile se vor deschide pe tot ecranul, ca o aplicație.</p>
      </div>

      <div class="setting">
        <button id="share-btn" class="pill pill-alt" type="button" hidden>Trimite povestea</button>
        <p id="share-status" class="setting-hint" role="status" hidden></p>
      </div>
    </div>
  </div>

  <script src="assets/js/iamlio.js" defer></script>
  <script src="assets/js/reader.js" defer></script>
</body>
</html>
